# Pre-commit hooks for Helga
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]      # Allow custom YAML tags
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: requirements-txt-fixer

  # Python linting + formatting with Ruff (formatting replaces black;
  # running two formatters lets black and ruff-format fight over the same
  # lines, so ruff-format is the single canonical formatter)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format


  # Type checking with mypy (disabled for now - enable gradually)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - types-requests
  #       args: [--ignore-missing-imports]
  #       exclude: ^(helga/tests/|docs/)

  # Security checks (disabled for now - enable after configuration)
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.10
  #   hooks:
  #   - id: bandit
  #     args: [-c, pyproject.toml]
  #     additional_dependencies: ['bandit[toml]']
  #     exclude: ^helga/tests/

  # Check for common security issues (disabled - needs .safety-policy.yml)
  # - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
  #   rev: v1.3.3
  #   hooks:
  #   - id: python-safety-dependencies-check
  #     files: requirements.txt

  # Markdown linting (disabled - too strict for existing docs)
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   rev: v0.42.0
  #   hooks:
  #   - id: markdownlint
  #     args: [--fix]

  # YAML formatting (disabled - modifies existing files)
  # - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  #   rev: v2.14.0
  #   hooks:
  #   - id: pretty-format-yaml
  #     args: [--autofix, --indent, '2']

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

# Configuration for specific hooks
default_language_version:
  python: python3.12

# Run these hooks on all files during first setup
default_stages: [pre-commit]

# Exclude certain files/directories
exclude: |
  (?x)^(
      \.git/|
      \.tox/|
      \.venv/|
      venv/|
      build/|
      dist/|
      \.eggs/|
      .*\.egg-info/|
      __pycache__/|
      \.pytest_cache/|
      \.mypy_cache/|
      \.coverage|
      htmlcov/|
      docs/build/
  )$

