version: '3.8'

services:
  irc:
    image: inspircd/inspircd-docker:latest
    container_name: helga-irc
    ports:
      - 6667:6667
    networks:
      - helga-network
    healthcheck:
      test: [CMD, nc, -z, localhost, '6667']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    container_name: helga-postgres
    platform: linux/amd64
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=helga
      - POSTGRES_USER=helga
      - POSTGRES_PASSWORD=helga
    networks:
      - helga-network
    healthcheck:
      test: [CMD-SHELL, pg_isready -U helga -d helga]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  helga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helga-bot
    environment:
      - HELGA_IRC_SERVER=irc
      - HELGA_DATABASE_HOST=postgres
      - HELGA_DATABASE_PORT=5432
      - HELGA_DATABASE_DB=helga
      - HELGA_DATABASE_USERNAME=helga
      - HELGA_DATABASE_PASSWORD=helga
      - HELGA_LOG_LEVEL=DEBUG
    volumes:
      # Note: Removed ./helga mount to avoid shadowing installed package
      # For development, rebuild the image after code changes
      - helga_logs:/var/log/helga
      - helga_data:/var/lib/helga
    depends_on:
      postgres:
        condition: service_healthy
      irc:
        condition: service_healthy
    networks:
      - helga-network
    restart: unless-stopped
    # Uncomment if using webhooks
    # ports:
    #   - "8080:8080"

networks:
  helga-network:
    driver: bridge
    name: helga-network

volumes:
  postgres_data:
    name: helga-postgres-data
  helga_logs:
    name: helga-logs
  helga_data:
    name: helga-data

# Made with Bob - Modernized for best practices
